<style>
:root{--bg:#dfe5ee;--pn:#fff;--tx:#1f2937;--mu:#6b7280;--ac:#2563eb;--ad:#1d4ed8;--bd:#d3dbe8;--ch:#eef3fb;--rb:#f5f8fc;--hv:#e4ecf9;--sl:#cddffb;--tb:#1d4fb8;--tbd:#173f96}
body.dk{--bg:#0b1220;--pn:#152038;--tx:#e6ebf5;--mu:#9aa8c2;--ac:#6ea8ff;--ad:#8bb8ff;--bd:#2a3a55;--ch:#1b2a46;--rb:#111b30;--hv:#22355a;--sl:#2d4a7c;--tb:#0f2a66;--tbd:#0b2050}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden;font-size:13px}
button,select,input{font-family:inherit}button{color:inherit}
.ic{display:block;flex:none;pointer-events:none}
/* title bar */
#top{background:var(--tb);color:#fff;height:44px;display:flex;align-items:center;gap:4px;padding:0 10px;flex:none}
#top .lg{width:24px;height:24px;border-radius:6px;margin-right:4px}

.qa,.tr{display:flex;gap:2px}
.tq{background:none;border:0;color:#fff;width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tq:hover{background:rgba(255,255,255,.18)}.tq.on{background:rgba(255,255,255,.28)}
.dn{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
#fn{background:transparent;border:1px solid transparent;color:#fff;font-size:14px;font-weight:600;text-align:center;border-radius:6px;padding:5px 8px;width:min(280px,36vw)}

#tabs button:hover{background:var(--hv)}
#tabs button.on{color:var(--ad);font-weight:600}
#tabs button.on:after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;background:var(--ac);border-radius:3px 3px 0 0}
#tabs button.file{background:var(--tb);color:#fff;font-weight:600;margin-right:6px;padding:0 20px}
#tabs button.file:hover{background:var(--tbd)}

.grp{display:flex;flex-direction:column;padding:0 7px;border-right:1px solid var(--bd);flex:none}
.grp:last-child{border-right:0}
.gb{display:flex;align-items:center;gap:2px;flex:1;min-height:80px}
.gn{text-align:center;font-size:11px;color:var(--mu);padding:2px 0 4px;white-space:nowrap}
.row{display:flex;align-items:center;gap:1px}
.col{display:flex;flex-direction:column;justify-content:center;gap:1px}
.rb{border:1px solid transparent;background:none;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx);position:relative;font-size:12px;-webkit-tap-highlight-color:transparent}
.rb:hover{background:var(--hv);border-color:var(--bd)}
.rb.on,.rb:active{background:var(--sl);border-color:var(--ac)}
.rb .ic{color:var(--tx)}.rb.lg .ic{color:var(--ad)}
.rb.lg{flex-direction:column;gap:4px;padding:6px 7px 3px;min-width:50px;height:80px;justify-content:flex-start;line-height:1.15;text-align:center}
.rb.lg span{display:flex;align-items:center;justify-content:center;gap:2px;max-width:96px;white-space:normal}
.rb.sm{height:26px;min-width:26px;padding:0 5px;gap:6px}

.split{display:flex;align-items:center}

.gal .stl{flex:none;width:80px;scroll-snap-align:start;background:var(--pn);border:1px solid transparent;border-radius:4px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:4px 6px;cursor:pointer;overflow:hidden}

.gal .stl b{font-weight:inherit;white-space:nowrap}

.gal .stl b{border-radius:3px}body.dk .gal .stl b{background:#fff;padding:1px 6px}
.gal .ga{width:20px;border:0;background:var(--ch);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.gal .ga:hover{background:var(--hv)}
/* popovers */
#pop{position:fixed;z-index:80;background:var(--pn);border:1px solid var(--bd);border-radius:8px;box-shadow:0 12px 32px rgba(15,23,42,.25);padding:4px;min-width:200px;max-height:72vh;overflow:auto;color:var(--tx)}
.mi{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:7px 11px;border-radius:5px;text-align:left;cursor:pointer;font-size:13px;color:var(--tx);position:relative}

.card{display:flex;gap:16px;align-items:center;text-align:left;padding:18px;border:1px solid var(--bd);border-radius:10px;background:var(--pn);cursor:pointer;color:var(--tx)}

.card .ic{color:var(--ad)}.card b{display:block;font-size:15px;margin-bottom:3px}.card small{color:var(--mu);font-size:12.5px;line-height:1.4;display:block}

#nav{width:230px;background:var(--pn);border-right:1px solid var(--bd);overflow:auto;padding:12px;font-size:13px;display:none;flex:none}

.page{background:#fff;color:#111;margin:0 auto;box-shadow:0 2px 14px rgba(15,23,42,.28);position:relative}
#xr{display:none;position:fixed;top:12px;right:18px;z-index:60;background:var(--tb);color:#fff;border:0;border-radius:20px;padding:8px 16px;cursor:pointer;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
body.rd #xr{display:block}
/* status bar */
#stat{background:var(--rb);border-top:1px solid var(--bd);color:var(--mu);font-size:12px;height:28px;display:flex;align-items:center;padding:0 8px;flex:none;overflow:hidden}
#stat>span{padding:0 12px;border-right:1px solid var(--bd);white-space:nowrap}

#stat .zm{margin-left:auto;border:0;display:flex;align-items:center;gap:4px;padding:0}
#stat .zb{width:24px;height:24px;border:0;background:none;border-radius:4px;cursor:pointer;color:var(--tx);display:flex;align-items:center;justify-content:center}
#stat .zb:hover{background:var(--hv)}
#zr{width:130px;accent-color:var(--ac);margin:0 2px}
#zl{min-width:42px;text-align:right;color:var(--tx);font-weight:600}
/* dialogs */
#dlg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:90;align-items:center;justify-content:center}
#dlg .box{background:var(--pn);color:var(--tx);border-radius:12px;min-width:330px;max-width:94vw;max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.4)}
#dlg h3{margin:0;padding:15px 20px;font-size:16px;font-weight:600;border-bottom:1px solid var(--bd)}

#dlg input[type=checkbox]{width:auto}#dlg input[type=color]{padding:0;height:30px}
#dlg .bt{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--bd)}
.btn{border:1px solid var(--bd);border-radius:6px;padding:7px 18px;background:var(--pn);cursor:pointer;font-size:13px;color:var(--tx)}
.btn:hover{background:var(--hv)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.btn.pri:hover{background:var(--ad)}
.sym{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:2px}.sym button{background:var(--ch);border:1px solid var(--bd);border-radius:6px;font-size:19px;padding:6px;cursor:pointer;color:var(--tx)}.sym button:hover{background:var(--hv);border-color:var(--ac)}
#fr{display:none;position:fixed;right:22px;top:100px;z-index:60;background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:0;width:310px;box-shadow:0 12px 32px rgba(15,23,42,.28)}
#fr .fh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;font-weight:600;border-bottom:1px solid var(--bd)}

#fr .fbd{padding:12px 16px 14px}
#fr input[type=text]{width:100%;margin:4px 0;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--pn);color:var(--tx);font-size:13px}

.fb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media (max-width:1150px){.gal{width:236px}}
@media (max-width:820px){#top .ttl,#sv{display:none}.qa .tq{width:30px}#zr{width:80px}#stat>span{padding:0 7px}}

.pgb #doc{border:2px solid #333;padding:8px}
.hf{display:none;color:#666;font-size:10pt;border-bottom:1px dashed #bbb;padding:4px 0;margin-bottom:8px;outline:none;min-height:22px}
#ftr{border-bottom:0;border-top:1px dashed #bbb;margin:8px 0 0}

}
